name: Build WiFi Guard (Android)

on:
  push:
    branches: ['**']
    paths:
      - 'wifi-guard/**'
      - '.github/workflows/wifi-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wifi-guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build installable debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: WiFiGuard-apk
          path: wifi-guard/app/build/outputs/apk/debug/app-debug.apk
